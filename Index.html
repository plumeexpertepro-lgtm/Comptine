<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Comptine — Apprendre à compter jusqu'à 30</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #fff8ec;
    --ink: #2b1d0e;
    --accent: #ff7a59;
    --accent2: #ffd166;
    --accent3: #06d6a0;
    --panel: #ffffff;
    --border: #f0e2cc;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    user-select: none;
    display: flex;
    flex-direction: column;
  }

  /* ─── Scène principale ─── */
  #stage {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    overflow: hidden;
    transition: background 0.8s ease;
  }

  #bigNumber {
    font-size: clamp(6rem, 28vw, 14rem);
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 6px 0 rgba(0,0,0,0.08);
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), color 0.5s;
    z-index: 5;
    letter-spacing: -0.04em;
  }
  #bigNumber.pop { transform: scale(1.25); }

  #wordLabel {
    font-size: clamp(1.2rem, 5vw, 2rem);
    font-weight: 600;
    color: var(--ink);
    margin-top: 0.3rem;
    opacity: 0.7;
    letter-spacing: 0.02em;
    z-index: 5;
    text-transform: lowercase;
  }

  /* ─── Zone des objets animés ─── */
  #objects {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .obj {
    position: absolute;
    font-size: clamp(2rem, 9vw, 4.5rem);
    opacity: 0;
    transform: scale(0) rotate(-30deg);
    transition: opacity 0.35s ease, transform 0.55s cubic-bezier(.34,1.56,.64,1);
    will-change: transform, opacity;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.12));
  }
  .obj.in {
    opacity: 1;
    transform: scale(1) rotate(0deg);
    animation: floaty 2.4s ease-in-out infinite;
  }
  @keyframes floaty {
    0%,100% { translate: 0 0; }
    50% { translate: 0 -8px; }
  }

  /* ─── Barre de progression ─── */
  #progressBar {
    position: absolute;
    top: 0; left: 0;
    height: 6px;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
    transition: width 0.5s ease;
    z-index: 10;
  }

  /* ─── Contrôles ─── */
  #controls {
    padding: 0.8rem 1rem 1.2rem;
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    flex-wrap: wrap;
    background: var(--panel);
    border-top: 1px solid var(--border);
    z-index: 20;
  }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.75rem 1.3rem;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.95); }
  button.secondary {
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--ink);
  }
  button:disabled { opacity: 0.35; }

  /* ─── Sélecteur de thème ─── */
  #themePicker {
    position: absolute;
    top: 1rem; right: 1rem;
    display: flex;
    gap: 0.4rem;
    z-index: 30;
  }
  .theme-dot {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: transform 0.2s;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .theme-dot:active { transform: scale(0.9); }
  .theme-dot.active { transform: scale(1.2); border-color: var(--ink); }

  /* ─── Écran de fin ─── */
  #endScreen {
    position: absolute;
    inset: 0;
    background: rgba(255,248,236,0.96);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    z-index: 50;
    text-align: center;
    padding: 2rem;
  }
  #endScreen.visible { display: flex; }
  #endScreen h2 {
    font-size: clamp(1.6rem, 8vw, 3rem);
    color: var(--accent);
  }
  #endScreen p { font-size: 1.1rem; opacity: 0.8; }

  /* ─── Compteur discret en haut ─── */
  #counter {
    position: absolute;
    top: 1rem; left: 1rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink);
    opacity: 0.5;
    z-index: 30;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="progressBar"></div>
  <div id="counter">1 / 30</div>
  <div id="themePicker"></div>
  <div id="bigNumber">1</div>
  <div id="wordLabel">un</div>
  <div id="objects"></div>

  <div id="endScreen">
    <h2>Bravo ! 🎉</h2>
    <p>Tu sais compter jusqu'à 30 !</p>
    <button id="replayBtn">Recommencer</button>
  </div>
</div>

<div id="controls">
  <button id="playBtn">▶ Lancer</button>
  <button id="pauseBtn" class="secondary" disabled>⏸ Pause</button>
  <button id="restartBtn" class="secondary">↻ Recommencer</button>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// CONFIGURATION DES THÈMES
// ══════════════════════════════════════════════════════════════════
const THEMES = [
  {
    id: 'ferme',
    name: 'Ferme',
    emoji: '🍎',
    bg: '#fff8ec',
    accents: ['#ff7a59', '#ffd166', '#06d6a0'],
    objects: ['🍎','🍎','🍎','🍎','🍎'],
    bgDecor: '🌾'
  },
  {
    id: 'ocean',
    name: 'Océan',
    emoji: '🐠',
    bg: '#e6f7ff',
    accents: ['#0096c7', '#48cae4', '#ffd166'],
    objects: ['🐠','🐟','🐡','🦀','🐙'],
    bgDecor: '🌊'
  },
  {
    id: 'espace',
    name: 'Espace',
    emoji: '⭐',
    bg: '#1a1a3a',
    accents: ['#ffd166', '#c77dff', '#4cc9f0'],
    objects: ['⭐','🌟','✨','💫','🌙'],
    bgDecor: '🌌',
    dark: true
  },
  {
    id: 'jungle',
    name: 'Jungle',
    emoji: '🌿',
    bg: '#eafbe7',
    accents: ['#2d6a4f', '#52b788', '#f4a261'],
    objects: ['🌿','🍃','🦋','🐛','🌸'],
    bgDecor: '🌴'
  },
  {
    id: 'ecole',
    name: 'École',
    emoji: '✏️',
    bg: '#fff0f3',
    accents: ['#e63946', '#457b9d', '#f4a261'],
    objects: ['✏️','📚','🖍️','📐','🎨'],
    bgDecor: '🎒'
  },
  {
    id: 'anniversaire',
    name: 'Anniversaire',
    emoji: '🎈',
    bg: '#fff5fa',
    accents: ['#ff006e', '#ffbe0b', '#8338ec'],
    objects: ['🎈','🎉','🎁','🧁','🍭'],
    bgDecor: '🎂'
  }
];

const WORDS_FR = [
  '', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix',
  'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf', 'vingt',
  'vingt et un', 'vingt-deux', 'vingt-trois', 'vingt-quatre', 'vingt-cinq',
  'vingt-six', 'vingt-sept', 'vingt-huit', 'vingt-neuf', 'trente'
];

const MAX_NUMBER = 30;

// ══════════════════════════════════════════════════════════════════
// ÉTAT
// ══════════════════════════════════════════════════════════════════
const state = {
  current: 1,
  themeIndex: 0,
  isPlaying: false,
  isPaused: false,
  timeouts: [],
  objectsShown: 0,
  speechEnabled: true,
  audioCtx: null,
  masterGain: null,
  musicTimer: null,
  musicStep: 0
};

// ══════════════════════════════════════════════════════════════════
// AUDIO — petite musique de fond générée
// ══════════════════════════════════════════════════════════════════
function initAudio() {
  if (state.audioCtx) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    state.audioCtx = new Ctx();
    state.masterGain = state.audioCtx.createGain();
    state.masterGain.gain.value = 0.06;
    state.masterGain.connect(state.audioCtx.destination);
  } catch (e) {
    console.warn('Audio non disponible', e);
  }
}

function playNote(freq, duration, type = 'sine', gainValue = 0.5) {
  if (!state.audioCtx) return;
  const ctx = state.audioCtx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(gainValue, ctx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.connect(gain);
  gain.connect(state.masterGain);
  osc.start();
  osc.stop(ctx.currentTime + duration);
}

// Mélodie douce type comptine (gamme pentatonique)
const MELODY = [523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33];

function startMusic() {
  if (state.musicTimer) return;
  state.musicTimer = setInterval(() => {
    if (!state.isPlaying || state.isPaused) return;
    const note = MELODY[state.musicStep % MELODY.length];
    playNote(note, 1.2, 'sine', 0.25);
    // petite harmonie tous les 4 pas
    if (state.musicStep % 4 === 0) {
      playNote(note / 2, 1.6, 'triangle', 0.15);
    }
    state.musicStep++;
  }, 700);
}

function stopMusic() {
  if (state.musicTimer) {
    clearInterval(state.musicTimer);
    state.musicTimer = null;
  }
}

// Petit "pop" quand un objet apparaît
function playPop(index) {
  const base = 400 + (index % 8) * 60;
  playNote(base, 0.18, 'sine', 0.4);
}

// ══════════════════════════════════════════════════════════════════
// VOIX
// ══════════════════════════════════════════════════════════════════
let frenchVoice = null;

function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  frenchVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) || null;
}

if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text, rate = 0.85) {
  if (!state.speechEnabled || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = rate;
    u.pitch = 1.15;
    u.volume = 1;
    if (frenchVoice) u.voice = frenchVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ══════════════════════════════════════════════════════════════════
// RENDU
// ══════════════════════════════════════════════════════════════════
const stageEl = document.getElementById('stage');
const bigNumberEl = document.getElementById('bigNumber');
const wordLabelEl = document.getElementById('wordLabel');
const objectsEl = document.getElementById('objects');
const progressEl = document.getElementById('progressBar');
const counterEl = document.getElementById('counter');
const endScreenEl = document.getElementById('endScreen');
const themePickerEl = document.getElementById('themePicker');

function currentTheme() { return THEMES[state.themeIndex]; }

function applyTheme() {
  const t = currentTheme();
  stageEl.style.background = t.bg;
  document.body.style.background = t.bg;
  bigNumberEl.style.color = t.accents[0];
  if (t.dark) {
    wordLabelEl.style.color = '#fff';
    counterEl.style.color = '#fff';
  } else {
    wordLabelEl.style.color = '#2b1d0e';
    counterEl.style.color = '#2b1d0e';
  }
  renderThemePicker();
}

function renderThemePicker() {
  themePickerEl.innerHTML = THEMES.map((t, i) =>
    `<button class="theme-dot ${i === state.themeIndex ? 'active' : ''}" data-theme="${i}" title="${t.name}">${t.emoji}</button>`
  ).join('');
  themePickerEl.querySelectorAll('[data-theme]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.themeIndex = parseInt(btn.dataset.theme, 10);
      applyTheme();
      resetScene();
    });
  });
}

// Placement des objets de manière aléatoire mais sans trop de chevauchement
function randomPosition(index, total) {
  // grille virtuelle 5x6 pour répartir
  const cols = 5;
  const rows = 6;
  const col = index % cols;
  const row = Math.floor(index / cols) % rows;
  const cellW = 100 / cols;
  const cellH = 100 / rows;
  const jitterX = (Math.random() - 0.5) * cellW * 0.5;
  const jitterY = (Math.random() - 0.5) * cellH * 0.5;
  const x = col * cellW + cellW / 2 + jitterX;
  const y = row * cellH + cellH / 2 + jitterY;
  return { x, y };
}

function clearObjects() {
  objectsEl.innerHTML = '';
  state.objectsShown = 0;
}

function addObject(index, total) {
  const t = currentTheme();
  const emoji = t.objects[index % t.objects.length];
  const pos = randomPosition(index, total);
  const el = document.createElement('div');
  el.className = 'obj';
  el.textContent = emoji;
  el.style.left = `calc(${pos.x}% - 1.5rem)`;
  el.style.top = `calc(${pos.y}% - 1.5rem)`;
  // éviter de cacher le chiffre central : si trop près du centre, décaler
  if (Math.abs(pos.x - 50) < 15 && Math.abs(pos.y - 50) < 12) {
    el.style.left = pos.x < 50 ? '10%' : '80%';
  }
  objectsEl.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  playPop(index);
}

function showNumber(n) {
  bigNumberEl.textContent = String(n);
  wordLabelEl.textContent = WORDS_FR[n] || String(n);
  bigNumberEl.classList.remove('pop');
  void bigNumberEl.offsetWidth;
  bigNumberEl.classList.add('pop');
  counterEl.textContent = `${n} / ${MAX_NUMBER}`;
  progressEl.style.width = `${(n / MAX_NUMBER) * 100}%`;

  // couleur qui tourne
  const t = currentTheme();
  bigNumberEl.style.color = t.accents[(n - 1) % t.accents.length];
}

// ══════════════════════════════════════════════════════════════════
// DÉROULEMENT D'UNE SCÈNE
// ══════════════════════════════════════════════════════════════════
function clearTimers() {
  state.timeouts.forEach(t => clearTimeout(t));
  state.timeouts = [];
}
function later(fn, ms) {
  const id = setTimeout(fn, ms);
  state.timeouts.push(id);
  return id;
}

async function playScene(n) {
  showNumber(n);
  clearObjects();

  // Petit silence avant de compter
  await wait(300);
  if (!state.isPlaying || state.isPaused) return;

  // Dire le nombre
  speak(WORDS_FR[n] || String(n), 0.8);

  // Faire apparaître les objets un par un
  const delayPerObject = n <= 10 ? 350 : n <= 20 ? 250 : 200;

  for (let i = 0; i < n; i++) {
    if (!state.isPlaying || state.isPaused) return;
    addObject(i, n);
    await wait(delayPerObject);
  }

  // Pause finale pour savourer
  await wait(500);
}

function wait(ms) {
  return new Promise(resolve => {
    const check = () => {
      if (!state.isPlaying) { resolve(); return; }
      if (state.isPaused) { later(check, 100); return; }
      resolve();
    };
    later(check, ms);
  });
}

async function run() {
  state.isPlaying = true;
  state.isPaused = false;
  endScreenEl.classList.remove('visible');
  document.getElementById('playBtn').disabled = true;
  document.getElementById('pauseBtn').disabled = false;
  initAudio();
  if (state.audioCtx && state.audioCtx.state === 'suspended') {
    state.audioCtx.resume();
  }
  startMusic();

  for (let n = state.current; n <= MAX_NUMBER; n++) {
    if (!state.isPlaying) return;
    state.current = n;
    await playScene(n);
    if (!state.isPlaying) return;
    // pause courte entre les chiffres
    await wait(600);
  }

  // Fin
  state.isPlaying = false;
  stopMusic();
  document.getElementById('playBtn').disabled = false;
  document.getElementById('pauseBtn').disabled = true;
  endScreenEl.classList.add('visible');
  speak('Bravo ! Tu sais compter jusqu\'à trente !', 0.9);
}

// ══════════════════════════════════════════════════════════════════
// CONTRÔLES
// ══════════════════════════════════════════════════════════════════
function resetScene() {
  clearTimers();
  state.isPlaying = false;
  state.isPaused = false;
  state.current = 1;
  stopMusic();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  clearObjects();
  showNumber(1);
  endScreenEl.classList.remove('visible');
  document.getElementById('playBtn').disabled = false;
  document.getElementById('pauseBtn').disabled = true;
  document.getElementById('playBtn').textContent = '▶ Lancer';
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (state.isPlaying && state.isPaused) {
    state.isPaused = false;
    document.getElementById('playBtn').disabled = true;
    document.getElementById('pauseBtn').disabled = false;
    return;
  }
  resetScene();
  run();
});

document.getElementById('pauseBtn').addEventListener('click', () => {
  if (!state.isPlaying) return;
  state.isPaused = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.getElementById('playBtn').disabled = false;
  document.getElementById('playBtn').textContent = '▶ Reprendre';
  document.getElementById('pauseBtn').disabled = true;
});

document.getElementById('restartBtn').addEventListener('click', () => {
  resetScene();
});

// ══════════════════════════════════════════════════════════════════
// INITIALISATION
// ══════════════════════════════════════════════════════════════════
applyTheme();
showNumber(1);
resetScene();

// Débloquer l'audio sur première interaction
document.body.addEventListener('touchstart', () => {
  initAudio();
  if (state.audioCtx && state.audioCtx.state === 'suspended') {
    state.audioCtx.resume();
  }
}, { once: true });
</script>
</body>
</html>
